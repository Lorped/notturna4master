<ion-header>

  <ion-toolbar color="medium">
    <ion-buttons slot="start">
      <ion-back-button default-href="home"></ion-back-button>
    </ion-buttons>
    <ion-title>Invia Messaggio di Clan</ion-title>
  </ion-toolbar>

</ion-header>


<ion-content   padding >

	<form (ngSubmit)="invia()" #modificaForm="ngForm">
		<ion-item >

			<ion-textarea placeholder="Scrivi qui il messaggio.." type="text" rows="20" [(ngModel)]="messaggio" name="newmessaggio" autofocus style="font-size:1.3em;"></ion-textarea>
		</ion-item>

    <ion-row  >
      <ion-col>
        <ion-button expand="full" shape="round" color="danger" type="submit" >Invia</ion-button>
			</ion-col>
    </ion-row>
	
	</form>
	
</ion-content>
